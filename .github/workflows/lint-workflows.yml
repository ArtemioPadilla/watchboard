name: Lint Workflows

# Static validation of the workflow files themselves.
#
# This exists because two real outages came from mistakes a linter catches
# instantly:
#   - `secrets` used in a step-level `if:` made daily-video.yml fail to parse.
#     GitHub reported zero jobs, produced no logs, and silently stopped
#     generating the scheduled runs — ~7.5 weeks with no daily video.
#   - tracker-lifecycle.yml read `steps.scout.outputs.result`, an output the
#     action does not expose, so the issue-creation step never ran.
#
# Neither surfaced as a normal test failure, and one left no logs at all.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run actionlint
        # Pinned to a release rather than latest so a new upstream check cannot
        # turn an unrelated PR red without us choosing to take it.
        run: |
          VERSION=1.7.12
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version

          # Script bodies are linted at severity `warning`.
          #
          # Running shellcheck at its default severity reports 212 findings
          # across every workflow, 158 of them SC2086 "double quote to prevent
          # globbing" on scripts that have run correctly for months. A check
          # that starts red gets ignored or switched off, and mass-quoting
          # long-lived shell for a style rule risks breaking working pipelines
          # to fix nothing.
          #
          # The 19 warnings that backlog referred to (SC2044, SC2034, SC2046,
          # SC2155) have since been cleared, so the level is `warning` and the
          # repo is clean at it. `info` and `style` stay off: they are ~180
          # SC2086 quoting suggestions on shell that works, and turning them on
          # would put the check back in the red it was designed to avoid.
          #
          # This level covers shell that cannot be parsed — quoting that
          # terminates a string early, unbalanced constructs — which is the
          # failure mode that killed the scout's issue-creation step at runtime
          # with "syntax error near unexpected token" — plus fragile constructs
          # like `for f in $(find ...)`, which silently mishandles paths with
          # spaces.
          SHELLCHECK_OPTS="-S warning" ./actionlint -color
