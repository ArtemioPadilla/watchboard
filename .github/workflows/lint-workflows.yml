name: Lint Workflows

# Static validation of the workflow files themselves.
#
# This exists because two real outages came from mistakes a linter catches
# instantly:
#   - `secrets` used in a step-level `if:` made daily-video.yml fail to parse.
#     GitHub reported zero jobs, produced no logs, and silently stopped
#     generating the scheduled runs — ~7.5 weeks with no daily video.
#   - tracker-lifecycle.yml read `steps.scout.outputs.result`, an output the
#     action does not expose, so the issue-creation step never ran.
#
# Neither surfaced as a normal test failure, and one left no logs at all.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Run actionlint
        # Pinned to a release rather than latest so a new upstream check cannot
        # turn an unrelated PR red without us choosing to take it.
        run: |
          VERSION=1.7.12
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -version

          # Script bodies are NOT linted here (-shellcheck= disables it).
          # Enabling it surfaced 212 pre-existing findings across every
          # workflow, almost all SC2086 "double quote to prevent globbing" on
          # scripts that have run correctly for months. A check that starts red
          # gets ignored or switched off, and mass-quoting long-lived shell for
          # a style rule risks breaking working pipelines to fix nothing.
          #
          # The purpose of this job is the class of bug that actually caused
          # outages here — invalid contexts, non-existent outputs, malformed
          # expressions — and actionlint catches those without shellcheck.
          # Cleaning up the shell debt and re-enabling it is worth doing as its
          # own change.
          ./actionlint -color -shellcheck=
