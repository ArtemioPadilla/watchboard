name: Tests

# The repo had 225 vitest tests across 18 files and nothing ran them. They
# passed locally and were never executed on a PR, which makes them decoration:
# a test that never runs cannot fail, so it cannot tell you anything.
#
# This matters most for the pipeline logic under tests/ (light-scan dedup,
# triage, data freshness), where the recurring failure mode has been a step
# reporting success while its work silently went nowhere.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Env-var table in docs/self-hosting.md matches the code
        run: npx tsx scripts/list-env-vars.ts --check docs/self-hosting.md

      # `npm run build` is generate-api + copy-cesium + astro build: it never
      # type-checked, and `npm run check` (astro check) dies with "JavaScript
      # heap out of memory" on 18k pages. So nothing in CI had ever looked at
      # the types, while CLAUDE.md claimed "Type-check + build".
      #
      # 57 errors exist today, mostly in the legacy scripts/update-data.ts and
      # a lib variance in worker/web-push.ts. Gating on zero would mean never
      # shipping a gate; starting red would mean the check gets ignored. So it
      # is a ratchet: types-baseline.json records what exists and this fails on
      # anything new. Signatures drop line numbers, so moved code is not new.
      - name: No new type errors (ratchet against types-baseline.json)
        run: npm run check-types
