name: Refresh Radio Layers

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC — stations and towers change slowly; weekly avoids hammering Overpass/radio-browser
  workflow_dispatch: {}

permissions:
  contents: write

# Shared group serializes the small state-commit workflows against each other
# (post-social-queue, weekly-digest, tally-tracker-votes, backfill, daily-video)
# so they don't race pushes to main.
concurrency:
  group: main-commits
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # npm ci without a cache, an Overpass query with a 90 s server budget
    # and a radio-browser fetch don't reliably fit the 5 min sibling
    # workflows use.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx scripts/geo/refresh-layers.ts --layer radio-towers
      - run: npx tsx scripts/geo/refresh-layers.ts --layer radio-stations
      - run: npx vitest run scripts/geo/refresh-layers.test.ts
      - name: Commit if changed
        run: |
          git config user.name "watchboard-bot"
          git config user.email "bot@watchboard.dev"
          git add public/geo/layers/radio-towers.geojson public/geo/layers/radio-stations.geojson
          if ! git diff --staged --quiet; then
            git commit -m "chore(radio): weekly refresh $(date -u +%Y-%m-%dT%H-%M-%SZ)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi
