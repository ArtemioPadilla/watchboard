name: E2E (Playwright)

# Two Playwright specs existed for months without any workflow running them
# (BACKLOG BL-022). This runs the shareable-view specs added by E1 on every
# PR; the older specs are opted in once they are known to pass in CI.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Generate the static API (public/api/v1, read by the activity spec)
        run: npm run generate-api

      - name: Run shareable-view specs
        env:
          PUBLIC_ENABLE_DEEPSTATE: 'true'
        run: npx playwright test e2e/globe-share.spec.ts e2e/map-share.spec.ts e2e/home-share.spec.ts e2e/alerts-panel.spec.ts e2e/dossier.spec.ts e2e/geo-layers.spec.ts e2e/provenance.spec.ts e2e/pending-pins.spec.ts e2e/activity-sort.spec.ts --reporter=list
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
