# video/ and mcp/ are separate npm packages with their own package.json,
# tsconfig and lockfile, and the root `npm ci` installs neither — Remotion
# comes from `make video-prep`, the MCP SDK from nobody. `tsconfig.check.json`
# therefore excludes them, because from the root every import under them is
# unresolvable and every error an artefact of the missing types rather than a
# defect. The consequence was that a real type error in either reached main
# unseen: nothing in CI had ever compiled them.
#
# The same job runs video's own 35 tests, which no workflow ran either: the
# root vitest `include` is src/, tests/ and scripts/ only. mcp has no tests.
#
# Path-filtered because it is two more npm installs. src/lib is in the filter
# because video/src/data/fetch-breaking.ts imports from it.
name: Subpackage types and tests

on:
  pull_request:
    paths:
      - 'video/**'
      - 'mcp/**'
      - 'src/lib/**'
      - '.github/workflows/subpackage-types.yml'
  push:
    branches: [main]
    paths:
      - 'video/**'
      - 'mcp/**'
      - 'src/lib/**'
      - '.github/workflows/subpackage-types.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Remotion's peer ranges are why the Makefile installs this one with
          # --legacy-peer-deps; `npm ci` has to agree with it.
          - pkg: video
            install: npm ci --legacy-peer-deps
            # video/src/data/fetch-breaking.ts imports the parent repo's
            # src/lib/activity-index.ts, and transforming a file up there makes
            # vite read the ROOT tsconfig.json — which `extends
            # "astro/tsconfigs/strict"`, a package only the root install
            # provides. Without it: `[TSCONFIG_ERROR] Failed to load tsconfig
            # for '../src/lib/activity-index.ts': Tsconfig not found`, with
            # both tsconfigs sitting right there. Reproduced in a worktree with
            # no root node_modules, and fixed by making astro resolvable.
            root_install: npm ci
            # 35 tests that no workflow ran: the root vitest `include` covers
            # src/, tests/ and scripts/ only, and nothing else compiles or runs
            # this package. The deps are installed here already.
            test: npm test
          - pkg: mcp
            install: npm ci
            root_install: ''
            test: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ${{ matrix.pkg }}/package-lock.json
      - name: Install root dependencies
        if: matrix.root_install != ''
        run: ${{ matrix.root_install }}
      - name: Install ${{ matrix.pkg }} dependencies
        working-directory: ${{ matrix.pkg }}
        run: ${{ matrix.install }}
      - name: Type-check ${{ matrix.pkg }}
        working-directory: ${{ matrix.pkg }}
        run: npm run typecheck
      - name: Test ${{ matrix.pkg }}
        if: matrix.test != ''
        working-directory: ${{ matrix.pkg }}
        run: ${{ matrix.test }}
