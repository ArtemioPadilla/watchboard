name: Hourly Light Scan

on:
  schedule:
    - cron: '0,15,30,45 * * * *'   # every 15 minutes
  workflow_dispatch: {}

# Never cancel: a cancelled run may already have alerted the public channel
# but not yet pushed state.alerted; the next run would post again.
# concurrency queues one pending run instead.
concurrency:
  group: hourly-light-scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    # The job timeout cancels the whole job, and always() steps then share the
    # cancelled job's short grace period. The scan step carries its own,
    # shorter timeout so a slow scan fails its step and the commit still runs.
    timeout-minutes: 5
    steps:
      # ref: main, not the run's SHA: a re-run reuses GITHUB_SHA and would not
      # see the state.alerted an earlier attempt pushed.
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci

      - name: Run light scan
        id: scan
        timeout-minutes: 4
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # A public send with an unknown outcome (timeout, 5xx) is recorded
          # and never retried; the scan tells the PRIVATE ops chat instead.
          # TELEGRAM_CHANNEL_ID is passed only so it can refuse when the two
          # secrets are ever the same chat.
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_CHANNEL_ID:    ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: npx tsx scripts/hourly-light-scan.ts

      - name: Commit pending-candidates + triage-log + state
        # always(): a scan that alerted the public channel and then failed must
        # still push whatever state it saved, or the next run re-posts.
        if: always()
        env:
          # push-state.sh alerts the PRIVATE ops chat on a final push failure.
          # TELEGRAM_CHANNEL_ID is passed only so it can refuse to alert when
          # the two secrets are ever the same chat.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          git config user.name  "watchboard-bot"
          git config user.email "bot@watchboard.dev"
          # Add each file separately. `git add a b c` fails as a whole when any
          # path is missing, and the `|| true` hid it: pending-candidates.json
          # is written to scripts/state/ (and gitignored), not public/_hourly/,
          # so the add aborted and state.json was never staged either. Nothing
          # from this workflow has been committed since 2026-05-21 as a result —
          # state.alerted never persisted, so the dedup added in #198 started
          # every run with no memory and re-posted the same stories every
          # 15 minutes.
          # The weekly archives (triage-log-YYYY-Www.json) must be committed too.
          # The log partitions aged-out entries into them and prunes the main
          # file; committing only the main file means those entries are pruned
          # from a tracked file into an untracked one that the next run's fresh
          # checkout never sees. They are gone, and the `weeks` index in the
          # main log points at files that were never pushed -- which is why the
          # audit page's archive loader has always had nothing to load.
          for f in public/_hourly/triage-log.json public/_hourly/state.json \
                   public/_hourly/alerts.json public/_hourly/gdacs.json public/_hourly/triage-log-[0-9]*.json; do
            [ -f "$f" ] && git add "$f"
          done
          if ! git diff --cached --quiet; then
            # Verify the artefact, not the exit code: the alerts feed must be
            # in this commit with a timestamp from this run. Only after a
            # successful scan: a crashed scan never reaches the alerts.json
            # write, and this guard must not stop its saved state landing.
            if [ "${{ steps.scan.outcome }}" = "success" ]; then
              git diff --cached --name-only | grep -q '^public/_hourly/alerts.json$' \
                || { echo '::error::public/_hourly/alerts.json was not staged'; exit 1; }
            fi
            git commit -m "chore(light-scan): update pending + audit + state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # Rebase + retry + backoff; on final failure a PRIVATE ops alert
            # (TELEGRAM_ALERT_CHAT_ID only) so the state is landed by hand.
            PUSH_STATE_DETAIL="light-scan state.alerted — $(git show --stat --format= HEAD | tail -1)" \
              bash scripts/ci/push-state.sh light-scan-state 5
          fi

  # ── Notify Telegram on failure (deduped: only first failure in a streak) ──
  # Light scan runs every 15 min, so naive alerting would spam. We check the
  # immediately-prior run's conclusion via `gh run list` and alert only when
  # the previous run was NOT also a failure (i.e., this is the first failure
  # in a row). Tradeoff: if the prev-run lookup itself fails (rate limit, gh
  # outage), we fall back to alerting — better noisy than silent.
  notify-failure:
    needs: [scan]
    # A timed-out job reports as cancelled, not failed — see update-data.yml.
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check previous run + alert Telegram
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Infra alerts go to TELEGRAM_ALERT_CHAT_ID (private ops chat), NEVER to
          # TELEGRAM_CHANNEL_ID — that is the public content channel with
          # outside subscribers. If the alert secret is unset the guard below
          # exits quietly rather than falling back to the public channel.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID missing; skipping Telegram alert"
            exit 0
          fi

          # Look up the previous run's conclusion. .[0] is the current (still
          # in-progress) run, so .[1] is the most recent finished one.
          PREV_CONCLUSION=$(gh run list \
            --workflow=light-scan.yml \
            --repo "${{ github.repository }}" \
            --limit 2 \
            --json conclusion \
            --jq '.[1].conclusion' 2>/dev/null || echo "unknown")
          echo "Previous run conclusion: ${PREV_CONCLUSION}"

          if [ "$PREV_CONCLUSION" = "failure" ]; then
            echo "Previous run also failed — skipping Telegram alert to avoid spam (15-min cron)"
            exit 0
          fi

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          TEXT=$(printf '🚨 Light Scan FAILED (first in streak)\nJob: scan\nSHA: %s\n%s' "$SHA_SHORT" "$RUN_URL")
          PAYLOAD=$(jq -n --arg c "$TELEGRAM_CHAT_ID" --arg t "$TEXT" \
            '{chat_id: $c, text: $t, disable_web_page_preview: false}')
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Telegram post failed (non-blocking)"
