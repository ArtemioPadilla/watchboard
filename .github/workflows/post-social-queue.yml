name: Post Social Queue

on:
  schedule:
    - cron: '0 8,13,18,22 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/post-social-queue.yml'

permissions:
  contents: write

# Shared group serializes the small state-commit workflows against each other
# so they don't race pushes to main.
concurrency:
  group: main-commits
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Post due items from queue to Bluesky
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: npx tsx scripts/bluesky-post.ts

      # X, staged restart after the April 2026 suspension (#235).
      #   - Off until the repository variable X_POSTING_ENABLED is 'true'.
      #   - Even then, only entries a human approved in /social/ are posted.
      #     Set X_ALLOW_AUTO_APPROVED to 'true' once a week of output reads well.
      #   - Languages come from social-config.json (en, es).
      # Both posters share the queue; scripts/lib/social-due.ts keeps per-platform
      # state so Bluesky posting first does not starve X or vice versa.
      - name: Post due items from queue to X
        if: vars.X_POSTING_ENABLED == 'true'
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          X_ALLOW_AUTO_APPROVED: ${{ vars.X_ALLOW_AUTO_APPROVED }}
        run: npx tsx scripts/post-social-queue.ts

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/_social/
          if git diff --cached --quiet public/_social/; then
            echo "No social changes"
            exit 0
          fi
          git commit -m "chore(social): post queue $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              pushed=true
              break
            fi
            echo "Push attempt $i failed, retrying..."
            sleep 2
          done
          if [ "$pushed" != "true" ]; then
            echo "::error::Failed to push social post history after 3 attempts — posted tweets/budget will be re-processed on next run"
            exit 1
          fi
