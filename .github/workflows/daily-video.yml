name: Daily Intelligence Brief Video

on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC = 6 PM CDMX
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/daily-video.yml'

permissions:
  contents: write

# Shared group serializes the small state-commit workflows against each other
# so they don't race pushes to main.
concurrency:
  group: main-commits
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    timeout-minutes: 40
    steps:
      # `ref: main`, not the default github.sha: a GitHub re-run reuses the
      # original SHA and would not see the video-post-<date>.json attempt 1
      # pushed, so post-video-social.ts and telegram-video-post.ts would both
      # post again.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install video dependencies
        run: cd video && npm ci --legacy-peer-deps

      - name: Ensure browser for Remotion
        run: cd video && npx remotion browser ensure

      - name: Render video
        run: cd video && npx tsx render.ts

      # Snapshot the caption RIGHT after the render — before any git pull/rebase
      # can clobber breaking.json. Fix for: caption was reading a stale
      # breaking.json that the rebase reverted to main's older version.
      - name: Snapshot Telegram caption from breaking.json
        run: |
          DATE=$(date -u +%Y-%m-%d)
          DATE="$DATE" node -e "
            function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
            function slugTag(slug){return '#' + slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');}
            function headlineTags(text){
              const STOP = new Set(['The','And','For','With','From','This','That','New','Day','Week','April','March','May','June','July','August','September','October','November','December','January','February','At','In','On','Of','To','By','As','Is','It','Be','Are','An','A','Or','But','If','So','We','You','Our','Their','Its','Has','Have','After','Before','When','While','Where','Why','How','First','Last','Big','Top','Two','Three','Four']);
              const tokens = (text.match(/\b[A-Z][A-Za-z0-9]{1,}(?:\s[A-Z][A-Za-z0-9]+)?\b|\b[A-Z]{2,}\b/g) || [])
                .map(t => t.replace(/\s+/g, ''))
                .filter(t => t.length >= 3 && !STOP.has(t));
              return tokens.map(t => '#' + t);
            }
            const fs = require('fs');
            const date = process.env.DATE;
            try {
              const d = JSON.parse(fs.readFileSync('video/src/data/breaking.json', 'utf8'));
              const lines = d.trackers.map(t => {
                const head = (t.headline || t.name || '').trim();
                return '• <b>' + escapeHtml(t.name) + '</b>: ' + escapeHtml(head);
              }).join('\n');
              const topical = [];
              const seen = new Set();
              for (const t of d.trackers) {
                const tag = slugTag(t.slug);
                if (!seen.has(tag.toLowerCase())) { topical.push(tag); seen.add(tag.toLowerCase()); }
                if (topical.length >= 4) break;
              }
              if (topical.length < 4) {
                const allHeadlines = d.trackers.map(t => t.headline || '').join(' ');
                for (const tag of headlineTags(allHeadlines)) {
                  if (seen.has(tag.toLowerCase())) continue;
                  topical.push(tag); seen.add(tag.toLowerCase());
                  if (topical.length >= 4) break;
                }
              }
              const hashtags = (topical.slice(0, 4).join(' ') + ' #Watchboard').trim();
              const cap = '🔴 <b>Watchboard Daily Brief</b> — ' + date + '\n\n' + lines + '\n\n🔗 watchboard.dev\n\n' + hashtags;
              fs.writeFileSync('/tmp/telegram-caption-breaking.txt', cap);
              console.log('Snapshotted caption (' + cap.length + ' chars)');
            } catch (e) {
              const cap = '🔴 Watchboard Daily Brief — ' + date + '\n\n🔗 watchboard.dev\n\n#Watchboard';
              fs.writeFileSync('/tmp/telegram-caption-breaking.txt', cap);
              console.log('Caption snapshot fell back to minimal — ' + e.message);
            }
          "

      # Root deps are needed here (tsx for the narration script) and again
      # below for the social post; installing once, before both, changes nothing
      # else in the order.
      - name: Install root dependencies
        run: npm ci

      # Narration moved from AWS Polly to ElevenLabs (#244). Polly had failed
      # with NoCredentials on every run — this workflow never configured AWS —
      # and `continue-on-error` + `|| echo` kept the run green while every
      # video shipped silent. The script writes the same files the merge step
      # expects; the text lives in scripts/narrate-elevenlabs.ts so it is
      # unit-tested and shell quoting cannot mangle a headline.
      #
      # Exit codes: 0 audio written · 3 no API key (ship without voice, warn) ·
      # anything else is a real failure: private ops alert, and the final
      # gate turns the job red. The video still renders and posts.
      - name: Generate narration with ElevenLabs
        id: narrate
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_EN: ${{ vars.ELEVENLABS_VOICE_EN }}
          ELEVENLABS_VOICE_ES: ${{ vars.ELEVENLABS_VOICE_ES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set +e
          npx tsx scripts/narrate-elevenlabs.ts --mode breaking --lang en --out video/output/narration-en.mp3
          rc_en=$?
          npx tsx scripts/narrate-elevenlabs.ts --mode breaking --lang es --out video/output/narration-es.mp3
          rc_es=$?
          set -e
          if [ "$rc_en" -eq 3 ] && [ "$rc_es" -eq 3 ]; then
            echo "::warning::ELEVENLABS_API_KEY is not set — the daily brief ships without narration"
            exit 0
          fi
          if [ "$rc_en" -ne 0 ] || [ "$rc_es" -ne 0 ]; then
            bash scripts/ci/ops-alert.sh "⚠️ Daily video narration failed (breaking: en=${rc_en} es=${rc_es}). The video was still rendered and posted, without voice."
            exit 1
          fi
          ls -la video/output/narration-*.mp3

      - name: Merge narration into video
        run: |
          DATE=$(date -u +%Y-%m-%d)
          VIDEO="video/output/watchboard-${DATE}.mp4"
          
          if [ -f video/output/narration-en.mp3 ] && [ -f "$VIDEO" ]; then
            ffmpeg -i "$VIDEO" -i video/output/narration-en.mp3 \
              -filter_complex '[0:a]volume=0.4[music];[1:a]volume=0.9[narr];[music][narr]amix=inputs=2:duration=first[out]' \
              -map 0:v -map '[out]' -c:v copy \
              "video/output/watchboard-${DATE}-narrated-en.mp4" -y || echo "Merge failed"
          fi

          if [ -f video/output/narration-es.mp3 ] && [ -f "$VIDEO" ]; then
            ffmpeg -i "$VIDEO" -i video/output/narration-es.mp3 \
              -filter_complex '[0:a]volume=0.4[music];[1:a]volume=0.9[narr];[music][narr]amix=inputs=2:duration=first[out]' \
              -map 0:v -map '[out]' -c:v copy \
              "video/output/watchboard-${DATE}-narrated-es.mp4" -y || echo "Merge failed"
          fi

      # Meta (Instagram Reels / Facebook Page) cannot take a file upload: it
      # fetches the MP4 from a public URL. Workflow artifacts are not public, so
      # the file is uploaded as an asset on the rolling `daily-video` release
      # (scripts/ci/host-release-asset.ts; assets older than 14 days pruned).
      # Runs only once the Meta secret exists — nothing changes before that.
      - name: Host video for Meta (release asset)
        id: host_video
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$META_PAGE_ACCESS_TOKEN" ]; then
            echo "Meta not configured — no public hosting needed"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          VIDEO="video/output/watchboard-${DATE}.mp4"
          NARRATED="video/output/watchboard-${DATE}-narrated-en.mp4"
          FILE="$VIDEO"; [ -f "$NARRATED" ] && FILE="$NARRATED"
          if [ ! -f "$FILE" ]; then echo "::warning::no video file to host"; exit 0; fi
          URL=$(npx tsx scripts/ci/host-release-asset.ts --file "$FILE" --tag daily-video --keep 14)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Hosted at $URL"

      # Exits 2 when an enabled platform did not get the video (record still
      # saved). continue-on-error keeps the record commit and Telegram going;
      # the final gate turns the job red. On 2026-09-29 Bluesky dropped the
      # post after the upload and this step stayed green with 0/1 posted.
      - name: Post to social media
        id: social_post
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          META_FB_PAGE_ID: ${{ vars.META_FB_PAGE_ID }}
          META_VIDEO_URL: ${{ steps.host_video.outputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # ops-alert.sh: PRIVATE ops chat only (refuses if equal to the channel).
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          VIDEO="video/output/watchboard-${DATE}.mp4"
          NARRATED="video/output/watchboard-${DATE}-narrated-en.mp4"
          # Prefer narrated version if available, fall back to base video
          if [ -f "$NARRATED" ]; then
            FILE="$NARRATED"
          elif [ -f "$VIDEO" ]; then
            FILE="$VIDEO"
          else
            echo "No video file found — skipping social post"
            exit 0
          fi
          rc=0
          npx tsx scripts/post-video-social.ts "$FILE" || rc=$?
          if [ "$rc" -ne 0 ]; then
            bash scripts/ci/ops-alert.sh "⚠️ Daily video was not posted to every social platform (exit ${rc}) — see 'Post to social media'."
            exit "$rc"
          fi

      # Before "Commit social post record": telegram-video-post.ts writes
      # posted.telegram into the same video-post-<date>.json record, so the
      # commit below carries it and a re-run (which checks out main) skips the
      # post. Response is checked (ok:true + message_id); a 4xx exits 1
      # (nothing went public), any crash exits 2 (may be public); an unknown outcome
      # (timeout/5xx) is recorded, NOT retried, and alerted privately.
      - name: Post video to Telegram
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # ops-alert.sh: PRIVATE ops chat only (refuses if equal to the channel).
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          # The `secrets` context is not available to step-level `if:`, so gate
          # on the env vars here instead. Using it in `if:` made the whole
          # workflow fail to start.
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "Telegram secrets not configured — skipping"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          # Base video (not the narrated cut), as before.
          VIDEO="video/output/watchboard-${DATE}.mp4"
          # Caption snapshot taken right after the render, before any git
          # pull/rebase could revert the data file: it matches the video.
          # Exit 1 = rejected (nothing public); 2 = may be public. The gate at
          # the end of the job reads `rc` to tell the two apart.
          rc=0
          npx tsx scripts/telegram-video-post.ts "$VIDEO" \
            --record "public/_social/video-post-${DATE}.json" \
            --caption-file /tmp/telegram-caption-breaking.txt || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Commit social post record
        id: commit_social
        continue-on-error: true
        env:
          # push-state.sh alerts the PRIVATE ops chat on final failure;
          # TELEGRAM_CHANNEL_ID is passed only so it can refuse if the two are equal.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          if [ -f "public/_social/video-post-${DATE}.json" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "public/_social/video-post-${DATE}.json"
            git diff --cached --quiet || git commit -m "chore(social): video post record ${DATE}"
            # The render leaves tracked files modified (video/src/data/breaking.json,
            # video/state/tracker-history.json); push-state.sh pulls with --autostash.
            PUSH_STATE_DETAIL="Daily video already posted to Bluesky/Telegram — DO NOT re-run; commit by hand: public/_social/video-post-${DATE}.json" \
              bash scripts/ci/push-state.sh "video-post-${DATE}" 5
          fi

      - name: Append to daily-log.json
        continue-on-error: true
        run: |
          DATE=$(date -u +%Y-%m-%d)
          VIDEO="video/output/watchboard-${DATE}.mp4"
          NARRATED="video/output/watchboard-${DATE}-narrated-en.mp4"
          mkdir -p video/state
          DATE="$DATE" VIDEO="$VIDEO" NARRATED="$NARRATED" RUN_ID="${{ github.run_id }}" node -e "
            const fs = require('fs');
            const path = 'video/state/daily-log.json';
            const date = process.env.DATE;
            let log = [];
            try { log = JSON.parse(fs.readFileSync(path, 'utf8')); } catch {}
            if (!Array.isArray(log)) log = [];
            if (log.some(e => e.date === date)) {
              console.log('Daily log already has entry for ' + date + ' — skipping append');
              process.exit(0);
            }
            const breaking = JSON.parse(fs.readFileSync('video/src/data/breaking.json', 'utf8'));
            const file = process.env.VIDEO;
            const narrated = process.env.NARRATED;
            const fileSize = fs.existsSync(file) ? fs.statSync(file).size : null;
            const narratedSize = fs.existsSync(narrated) ? fs.statSync(narrated).size : null;
            const items = (breaking.trackers || []).map(t => ({
              slug: t.slug,
              name: t.name,
              icon: t.icon,
              headline: t.headline,
              kpiLabel: t.kpiLabel,
              kpiValue: t.kpiValue,
              kpiPrefix: t.kpiPrefix,
              kpiSuffix: t.kpiSuffix,
              sourceTier: t.sourceTier,
              sourceLabel: t.sourceLabel,
              thumbnailUrl: Array.isArray(t.thumbnailUrls) ? t.thumbnailUrls[0] : null,
            }));
            log.push({
              date,
              renderedAt: new Date().toISOString(),
              mode: 'breaking',
              items,
              file: fileSize ? file : null,
              fileSizeMb: fileSize ? +(fileSize / 1024 / 1024).toFixed(2) : null,
              narratedFile: narratedSize ? narrated : null,
              narratedSizeMb: narratedSize ? +(narratedSize / 1024 / 1024).toFixed(2) : null,
              runId: process.env.RUN_ID,
            });
            log.sort((a, b) => b.date.localeCompare(a.date));
            fs.writeFileSync(path, JSON.stringify(log, null, 2) + '\n');
            console.log('Appended ' + date + ' (' + items.length + ' items) to daily-log.json');
          "

      - name: Commit tracker history + daily log
        id: commit_video_state
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          changed=0
          for f in video/state/tracker-history.json video/state/daily-log.json; do
            if [ -f "$f" ]; then
              git add "$f"
              changed=1
            fi
          done
          if [ $changed -eq 1 ]; then
            if git diff --cached --quiet; then
              echo "No video state to commit"
            else
              git commit -m "chore(video): update tracker history + daily log $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              PUSH_STATE_DETAIL="files: video/state/tracker-history.json, video/state/daily-log.json" \
                bash scripts/ci/push-state.sh "video-state" 5
            fi
          else
            echo "No video state to commit"
          fi

      - name: Upload video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-${{ github.run_id }}
          path: |
            video/output/*.mp4
            video/output/*.mp3
          retention-days: 30

      - name: Summary
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "## 🎬 Daily Video Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh video/output/*.mp4 2>/dev/null | while read line; do
            echo "- ${line}" >> $GITHUB_STEP_SUMMARY
          done
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download from the Artifacts section above." >> $GITHUB_STEP_SUMMARY

      - name: Fail job if a state commit/push failed
        # The two commit steps above run with continue-on-error: true so that
        # artifact upload and the Telegram post still happen even when the git
        # push fails — but that means their own `exit 1` never turns the job
        # red on its own. This step is the loud signal: it runs regardless of
        # what happened above (if: always()) and fails the whole run when
        # either commit/push step's outcome was failure, so a silently-dropped
        # push (video-post record or tracker-history/daily-log) is visible
        # instead of hiding behind a green run. The narration step is gated the
        # same way: Polly failed silently for months behind continue-on-error.
        # There is no notify-failure job in this workflow, so a red run here is
        # the only alert.
        if: always()
        run: |
          # "A re-run is safe" is printed only when Telegram exited 1
          # (rejected: nothing public) AND every state commit reached main
          # (so a re-run skips Bluesky). Anything else gets ONE "DO NOT RE-RUN".
          failed=0
          dnr=""
          if [ "${{ steps.commit_social.outcome }}" = "failure" ] || [ "${{ steps.commit_video_state.outcome }}" = "failure" ]; then
            dnr="${dnr} A state commit/push step failed — see 'Commit social post record' and/or 'Commit tracker history + daily log' above; bot state was not saved to main."
            failed=1
          fi
          if [ "${{ steps.narrate.outcome }}" = "failure" ]; then
            echo "::error::Narration failed — see 'Generate narration with ElevenLabs' above. The video posted without voice."
            failed=1
          fi
          if [ "${{ steps.social_post.outcome }}" = "failure" ]; then
            echo "::error::The video did not reach every enabled social platform — see 'Post to social media' above. Platforms in the post record are skipped on a re-run."
            failed=1
          fi
          if [ "${{ steps.telegram.outcome }}" = "failure" ]; then
            failed=1
            if [ "${{ steps.telegram.outputs.rc }}" = "1" ] && [ "${{ steps.commit_social.outcome }}" = "success" ] && [ "${{ steps.commit_video_state.outcome }}" = "success" ]; then
              echo "::error::Telegram rejected the daily video (4xx) — nothing was published there and the post record is on main; a re-run is safe"
            elif [ "${{ steps.telegram.outputs.rc }}" = "1" ]; then
              dnr="${dnr} Telegram rejected the video (4xx, nothing published there), but the post record is not on main, so a re-run would post to Bluesky again."
            else
              dnr="${dnr} The Telegram step failed (exit '${{ steps.telegram.outputs.rc }}', not a rejection) — the video may already be public on Telegram without a record."
            fi
          fi
          if [ -n "$dnr" ]; then
            echo "::error::DO NOT RE-RUN — the video is already public.${dnr}"
          fi
          exit $failed

  video-progress:
    name: Daily Progress Video (positive mode)
    runs-on: ubuntu-latest
    needs: video
    if: github.event_name != 'push'
    timeout-minutes: 40
    steps:
      # `ref: main`, not the default github.sha: the "video" job above has
      # already pushed two commits (video-post record, tracker-history +
      # daily-log) by the time this job starts. Checking out the SHA the run
      # was triggered on left this job two commits behind on a file the
      # progress render also modifies (tracker-history.json), so every
      # `pull --rebase --autostash` in push-state.sh conflicted and the
      # progress post record never reached main — daily, since April.
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video/package-lock.json

      - name: Install video dependencies
        run: cd video && npm ci --legacy-peer-deps

      - name: Ensure browser for Remotion
        run: cd video && npx remotion browser ensure

      - name: Render progress video
        run: cd video && npx tsx render.ts --mode positive

      # Snapshot the progress caption immediately after the progress render.
      # Must read breaking-data-progress.json (written by render.ts --mode positive),
      # NOT breaking.json which belongs to the conflict job and may carry stale
      # or conflict-mode trackers. See: https://github.com/ArtemioPadilla/watchboard/issues/141
      - name: Snapshot Telegram caption (progress) from breaking-data-progress.json
        run: |
          DATE=$(date -u +%Y-%m-%d)
          DATE="$DATE" node -e "
            function escapeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
            function slugTag(slug){return '#' + slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');}
            function headlineTags(text){
              const STOP = new Set(['The','And','For','With','From','This','That','New','Day','Week','April','March','May','June','July','August','September','October','November','December','January','February','At','In','On','Of','To','By','As','Is','It','Be','Are','An','A','Or','But','If','So','We','You','Our','Their','Its','Has','Have','After','Before','When','While','Where','Why','How','First','Last','Big','Top','Two','Three','Four']);
              const tokens = (text.match(/\b[A-Z][A-Za-z0-9]{1,}(?:\s[A-Z][A-Za-z0-9]+)?\b|\b[A-Z]{2,}\b/g) || [])
                .map(t => t.replace(/\s+/g, ''))
                .filter(t => t.length >= 3 && !STOP.has(t));
              return tokens.map(t => '#' + t);
            }
            const fs = require('fs');
            const date = process.env.DATE;
            try {
              const progressPath = 'video/src/data/breaking-data-progress.json';
              const fallbackPath = 'video/src/data/breaking.json';
              const srcPath = fs.existsSync(progressPath) ? progressPath : fallbackPath;
              if (srcPath === fallbackPath) console.warn('WARNING: breaking-data-progress.json not found, falling back to breaking.json');
              const d = JSON.parse(fs.readFileSync(srcPath, 'utf8'));
              const lines = d.trackers.map(t => {
                const head = (t.headline || t.name || '').trim();
                return '✅ <b>' + escapeHtml(t.name) + '</b>: ' + escapeHtml(head);
              }).join('\n');
              const topical = [];
              const seen = new Set();
              for (const t of d.trackers) {
                const tag = slugTag(t.slug);
                if (!seen.has(tag.toLowerCase())) { topical.push(tag); seen.add(tag.toLowerCase()); }
                if (topical.length >= 4) break;
              }
              if (topical.length < 4) {
                const allHeadlines = d.trackers.map(t => t.headline || '').join(' ');
                for (const tag of headlineTags(allHeadlines)) {
                  if (seen.has(tag.toLowerCase())) continue;
                  topical.push(tag); seen.add(tag.toLowerCase());
                  if (topical.length >= 4) break;
                }
              }
              const hashtags = (topical.slice(0, 4).join(' ') + ' #Watchboard').trim();
              const cap = '🌱 <b>Watchboard Progress Brief</b> — ' + date + '\n\n' + lines + '\n\nScience doesn\\'t take days off.\n🔗 watchboard.dev\n\n' + hashtags;
              fs.writeFileSync('/tmp/telegram-caption-progress.txt', cap);
              console.log('Snapshotted progress caption (' + cap.length + ' chars)');
            } catch (e) {
              const cap = '🌱 Watchboard Progress Brief — ' + date + '\n\n🔗 watchboard.dev\n\n#Watchboard';
              fs.writeFileSync('/tmp/telegram-caption-progress.txt', cap);
              console.log('Progress caption snapshot fell back — ' + e.message);
            }
          "

      - name: Install root dependencies
        run: npm ci

      # Same contract as the "video" job's narration step (see the comment there).
      - name: Generate narration with ElevenLabs (progress tone)
        id: narrate_progress
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_EN: ${{ vars.ELEVENLABS_VOICE_EN }}
          ELEVENLABS_VOICE_ES: ${{ vars.ELEVENLABS_VOICE_ES }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set +e
          npx tsx scripts/narrate-elevenlabs.ts --mode progress --lang en --out video/output/narration-progress-en.mp3
          rc_en=$?
          npx tsx scripts/narrate-elevenlabs.ts --mode progress --lang es --out video/output/narration-progress-es.mp3
          rc_es=$?
          set -e
          if [ "$rc_en" -eq 3 ] && [ "$rc_es" -eq 3 ]; then
            echo "::warning::ELEVENLABS_API_KEY is not set — the progress brief ships without narration"
            exit 0
          fi
          if [ "$rc_en" -ne 0 ] || [ "$rc_es" -ne 0 ]; then
            bash scripts/ci/ops-alert.sh "⚠️ Daily video narration failed (progress: en=${rc_en} es=${rc_es}). The video was still rendered and posted, without voice."
            exit 1
          fi
          ls -la video/output/narration-progress-*.mp3

      - name: Merge narration into progress video
        run: |
          DATE=$(date -u +%Y-%m-%d)
          VIDEO="video/output/watchboard-${DATE}-progress.mp4"

          if [ -f video/output/narration-progress-en.mp3 ] && [ -f "$VIDEO" ]; then
            ffmpeg -i "$VIDEO" -i video/output/narration-progress-en.mp3 \
              -filter_complex '[0:a]volume=0.4[music];[1:a]volume=0.9[narr];[music][narr]amix=inputs=2:duration=first[out]' \
              -map 0:v -map '[out]' -c:v copy \
              "video/output/watchboard-${DATE}-progress-narrated-en.mp4" -y || echo "Merge failed"
          fi

      # Meta (Instagram Reels / Facebook Page) cannot take a file upload: it
      # fetches the MP4 from a public URL. Workflow artifacts are not public, so
      # the file is uploaded as an asset on the rolling `daily-video` release
      # (scripts/ci/host-release-asset.ts; assets older than 14 days pruned).
      # Runs only once the Meta secret exists — nothing changes before that.
      - name: Host video for Meta (release asset)
        id: host_video_progress
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
        run: |
          if [ -z "$META_PAGE_ACCESS_TOKEN" ]; then
            echo "Meta not configured — no public hosting needed"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          VIDEO="video/output/watchboard-${DATE}-progress.mp4"
          NARRATED="video/output/watchboard-${DATE}-progress-narrated-en.mp4"
          FILE="$VIDEO"; [ -f "$NARRATED" ] && FILE="$NARRATED"
          if [ ! -f "$FILE" ]; then echo "::warning::no video file to host"; exit 0; fi
          URL=$(npx tsx scripts/ci/host-release-asset.ts --file "$FILE" --tag daily-video --keep 14)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Hosted at $URL"

      # Same contract as the breaking job's "Post to social media": exit 2 =
      # an enabled platform did not get the video; the final gate goes red.
      - name: Post to social media (progress)
        id: social_post_progress
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          VIDEO_TYPE: progress
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ vars.META_IG_USER_ID }}
          META_FB_PAGE_ID: ${{ vars.META_FB_PAGE_ID }}
          META_VIDEO_URL: ${{ steps.host_video_progress.outputs.url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # ops-alert.sh: PRIVATE ops chat only (refuses if equal to the channel).
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          VIDEO="video/output/watchboard-${DATE}-progress.mp4"
          NARRATED="video/output/watchboard-${DATE}-progress-narrated-en.mp4"
          if [ -f "$NARRATED" ]; then
            FILE="$NARRATED"
          elif [ -f "$VIDEO" ]; then
            FILE="$VIDEO"
          else
            echo "No progress video file found — skipping social post"
            exit 0
          fi
          rc=0
          VIDEO_TYPE=progress npx tsx scripts/post-video-social.ts "$FILE" || rc=$?
          if [ "$rc" -ne 0 ]; then
            bash scripts/ci/ops-alert.sh "⚠️ Progress video was not posted to every social platform (exit ${rc}) — see 'Post to social media (progress)'."
            exit "$rc"
          fi

      # Before "Commit social post record": telegram-video-post.ts writes
      # posted.telegram into the same video-post-progress-<date>.json record, so the
      # commit below carries it and a re-run (which checks out main) skips the
      # post. Response is checked (ok:true + message_id); a 4xx exits 1
      # (nothing went public), any crash exits 2 (may be public); an unknown outcome
      # (timeout/5xx) is recorded, NOT retried, and alerted privately.
      - name: Post progress video to Telegram
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          # ops-alert.sh: PRIVATE ops chat only (refuses if equal to the channel).
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          # The `secrets` context is not available to step-level `if:`, so gate
          # on the env vars here instead. Using it in `if:` made the whole
          # workflow fail to start.
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "Telegram secrets not configured — skipping"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          VIDEO="video/output/watchboard-${DATE}-progress.mp4"
          NARRATED="video/output/watchboard-${DATE}-progress-narrated-en.mp4"
          SEND="$VIDEO"
          [ -f "$NARRATED" ] && SEND="$NARRATED"
          # Caption snapshot taken right after the render, before any git
          # pull/rebase could revert the data file: it matches the video.
          # Exit 1 = rejected (nothing public); 2 = may be public. The gate at
          # the end of the job reads `rc` to tell the two apart.
          rc=0
          npx tsx scripts/telegram-video-post.ts "$SEND" \
            --record "public/_social/video-post-progress-${DATE}.json" \
            --caption-file /tmp/telegram-caption-progress.txt || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit $rc

      - name: Commit social post record
        id: commit_progress_social
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALERT_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # render.ts --mode positive calls saveUsedTrackers(), so the progress
          # picks land in tracker-history.json and are needed for tomorrow's
          # cooldown. Commit that file here instead of leaving it dirty for the
          # autostash to trip over. breaking.json is the *breaking* job's data
          # and is never committed by CI; restore it so the tree is clean.
          git checkout -- video/src/data/breaking.json 2>/dev/null || true
          [ -f "public/_social/video-post-progress-${DATE}.json" ] && git add "public/_social/video-post-progress-${DATE}.json"
          [ -f video/state/tracker-history.json ] && git add video/state/tracker-history.json
          if git diff --cached --quiet; then
            echo "No progress video state to commit"
          else
            git commit -m "chore(social): progress video post record ${DATE}"
            PUSH_STATE_DETAIL="Progress video already posted to Bluesky/Telegram — DO NOT re-run; commit by hand: public/_social/video-post-progress-${DATE}.json + video/state/tracker-history.json" \
              bash scripts/ci/push-state.sh "video-post-progress-${DATE}" 5
          fi

      - name: Upload progress video artifacts
        uses: actions/upload-artifact@v4
        with:
          name: daily-video-progress-${{ github.run_id }}
          path: |
            video/output/*.mp4
            video/output/*.mp3
          retention-days: 30

      - name: Summary
        run: |
          DATE=$(date -u +%Y-%m-%d)
          echo "## 🌱 Progress Video Generated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Date:** ${DATE}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh video/output/*.mp4 2>/dev/null | while read line; do
            echo "- ${line}" >> $GITHUB_STEP_SUMMARY
          done

      - name: Fail job if a state commit/push failed
        # Same reasoning as the "video" job's equivalent gate: "Commit social
        # post record" above runs with continue-on-error: true so artifact
        # upload / Telegram post still happen when the git push fails, which
        # means its own `exit 1` cannot turn the job red by itself. This step
        # runs regardless (if: always()) and fails the run when that step's
        # outcome was failure. No notify-failure job exists in this workflow,
        # so a red run here is the only alert.
        if: always()
        run: |
          # "A re-run is safe" is printed only when Telegram exited 1
          # (rejected: nothing public) AND the post record reached main (so a
          # re-run skips Bluesky). Anything else gets ONE "DO NOT RE-RUN".
          failed=0
          dnr=""
          if [ "${{ steps.commit_progress_social.outcome }}" = "failure" ]; then
            dnr="${dnr} Progress video social post record failed to push to main — see 'Commit social post record' above. The next run will not know this was already posted."
            failed=1
          fi
          if [ "${{ steps.narrate_progress.outcome }}" = "failure" ]; then
            echo "::error::Progress narration failed — see 'Generate narration with ElevenLabs (progress tone)' above. The video posted without voice."
            failed=1
          fi
          if [ "${{ steps.social_post_progress.outcome }}" = "failure" ]; then
            echo "::error::The progress video did not reach every enabled social platform — see 'Post to social media (progress)' above. Platforms in the post record are skipped on a re-run."
            failed=1
          fi
          if [ "${{ steps.telegram.outcome }}" = "failure" ]; then
            failed=1
            if [ "${{ steps.telegram.outputs.rc }}" = "1" ] && [ "${{ steps.commit_progress_social.outcome }}" = "success" ]; then
              echo "::error::Telegram rejected the progress video (4xx) — nothing was published there and the post record is on main; a re-run is safe"
            elif [ "${{ steps.telegram.outputs.rc }}" = "1" ]; then
              dnr="${dnr} Telegram rejected the video (4xx, nothing published there), but the post record is not on main, so a re-run would post to Bluesky again."
            else
              dnr="${dnr} The Telegram step failed (exit '${{ steps.telegram.outputs.rc }}', not a rejection) — the video may already be public on Telegram without a record."
            fi
          fi
          if [ -n "$dnr" ]; then
            echo "::error::DO NOT RE-RUN — the video is already public.${dnr}"
          fi
          exit $failed
