name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # Data commits do not trigger a deploy on their own.
    #
    # Every push to main queued another deploy, and a burst of them — a few
    # merges in a row, or a run of bot commits — leaves runs stacked in the
    # concurrency group cancelling each other. Twice now the group has ended up
    # wedged: runs sit `pending` with zero jobs indefinitely and nothing
    # publishes (see #193). Renaming the group cleared it the first time, which
    # is why it was thought to be the cause; it wedged again under the new name,
    # so the trigger volume is the real driver.
    #
    # Data still reaches the site through three other paths: the hourly scan's
    # explicit trigger-deploy job, the nightly's workflow_run, and the daily
    # schedule below. This only stops each individual data commit from opening
    # its own deploy.
    paths-ignore:
      - 'trackers/**'
      - 'public/_metrics/**'
      - 'public/_hourly/**'
      - 'public/_social/**'
      - 'public/_tracker-votes/**'
      - 'video/state/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Nightly Data Update"]
    types: [completed]
    branches: [main]
  # Safety net. The site went 16 days without publishing (last success
  # 2026-07-18) because every path to a deploy was blocked at once: the
  # workflow_run path required the nightly to conclude 'success' and it was
  # timing out to 'cancelled', while the push path never fires for bot commits
  # — GitHub does not trigger workflows for pushes made with GITHUB_TOKEN.
  # A daily schedule guarantees the published site cannot drift far behind the
  # committed data no matter which trigger is broken.
  schedule:
    - cron: '30 19 * * *'  # after the nightly (14:00) and freshness check (18:00)

permissions:
  contents: read
  pages: write
  id-token: write

# Renamed from "pages" on 2026-08-10. Every deploy queued behind that group
# stopped materialising: runs sat `pending` with zero jobs for 15+ minutes and
# were then superseded, so nothing published for ~14 hours while every other
# workflow in the repo started and finished normally. Ruled out in turn: repo
# concurrency collisions (no other workflow used the group), runner contention
# (no overlapping runs), the environment's branch policy (main is allowed),
# GitHub-wide incidents (all components operational), an orphaned github-pages
# deployment stuck without a status since 17:44 (resolved, no effect), and a
# stale queue (drained, no effect). What remained was the group itself.
# Renamed a second time (2026-08-16). Renaming is the only thing that has ever
# cleared a wedged group — runs sitting `pending` with zero jobs indefinitely —
# but it treats the symptom: the group jammed again under the previous name, so
# the name was never the cause. The paths-ignore above is the actual fix, since
# it removes the trigger bursts that precede every jam. This rename is only to
# unblock the queue that is stuck right now. If it wedges a third time, the
# burst theory is wrong too and #193 should go to GitHub Support.
concurrency:
  group: pages-deploy-2
  cancel-in-progress: false

jobs:
  build:
    # When triggered by workflow_run (nightly update), deploy unless it failed
    # outright. Other events (push, workflow_dispatch, schedule) always pass,
    # because the first clause is true and the || short-circuits.
    #
    # 'cancelled' is accepted deliberately: that is what a job timeout reports,
    # and a timed-out nightly still commits whatever it validated before the
    # wall. Requiring 'success' meant a partially-successful night published
    # nothing at all — data sat committed but unpublished for over two weeks.
    # Anything committed has already passed the JSON + Zod + build gates, so
    # publishing it is safe.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate tracker data (fail fast on bad JSON/schema)
        # Runs in ~1s. Surfaces invalid tracker data with a precise file:line
        # annotation in the Actions UI instead of waiting ~2 min for `astro build`
        # to crash with a vite plugin stack trace.
        run: npm run validate-data

      - name: Backfill missing digests
        run: npx tsx scripts/ensure-digests.ts

      - name: Build Astro site
        env:
          # A PUBLIC_POSTHOG_KEY secret has existed since April but nothing read
          # it — the key was inlined here instead. phc_ keys are public by
          # design (they ship in the page HTML), so that was never an exposure,
          # just two sources of truth where rotating meant editing code.
          #
          # No literal fallback on purpose. GitGuardian flags an inlined key
          # regardless of it being a publishable one, and more importantly a
          # fork building without the secret should NOT quietly report into this
          # project's analytics. No secret, no analytics, is the correct
          # behaviour — BaseLayout already skips the snippet when the key is
          # empty.
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
        run: npm run build

      - name: Generate health status
        run: npx tsx scripts/generate-health.ts

      - name: Copy health status into build output
        run: |
          mkdir -p dist/_health
          cp public/_health/status.json dist/_health/status.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Notify Telegram on build/deploy failure ──
  notify-failure:
    needs: [build, deploy]
    # A timed-out job reports as cancelled, not failed — see update-data.yml.
    if: failure() || cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Telegram failure alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Infra alerts go to TELEGRAM_ALERT_CHAT_ID (private ops chat), NEVER to
          # TELEGRAM_CHANNEL_ID — that is the public content channel with
          # outside subscribers. If the alert secret is unset the guard below
          # exits quietly rather than falling back to the public channel.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "TELEGRAM_BOT_TOKEN/CHAT_ID missing; skipping Telegram alert"
            exit 0
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          FAILED=""
          [ "$BUILD_RESULT" = "failure" ] && FAILED="$FAILED build"
          [ "$DEPLOY_RESULT" = "failure" ] && FAILED="$FAILED deploy"
          FAILED=$(echo "$FAILED" | xargs)
          [ -z "$FAILED" ] && FAILED="unknown"
          TEXT=$(printf '🚨 Pages Deploy FAILED\nJob(s): %s\nSHA: %s\n%s' "$FAILED" "$SHA_SHORT" "$RUN_URL")
          PAYLOAD=$(jq -n --arg c "$TELEGRAM_CHAT_ID" --arg t "$TEXT" \
            '{chat_id: $c, text: $t, disable_web_page_preview: false}')
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD" || echo "Telegram post failed (non-blocking)"
