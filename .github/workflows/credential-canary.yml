name: Credential Canary

# Daily liveness check on every credential the pipeline depends on.
#
# Rationale: CLAUDE_CODE_OAUTH_TOKEN was revoked on 2026-07-20 and took seven
# workflows down for two weeks before anyone noticed, and the X credentials had
# been failing since roughly April. Both were found by chance while debugging
# something else. A revoked secret is invisible until the thing that uses it
# happens to run and someone happens to read the log.
#
# Each check is deliberately cheap and runs independently, so one dead
# credential still reports on the others.

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC, well before the 14:00 nightly
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # claude-code-action exchanges an OIDC token, so without this the Claude
  # check fails with "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL" regardless of
  # whether the credential is actually valid — a false alarm on the very thing
  # this workflow exists to measure. Every other workflow using the action
  # already declares it.
  id-token: write

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # ── Telegram ──────────────────────────────────────────────────────────
      - name: Check Telegram
        id: telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHANNEL_ID" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "Telegram secrets not configured"
            exit 1
          fi
          OK=$(curl -s --max-time 15 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getMe" | jq -r '.ok // false')
          if [ "$OK" = "true" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      # ── Bluesky ───────────────────────────────────────────────────────────
      - name: Check Bluesky
        id: bluesky
        continue-on-error: true
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
        run: |
          if [ -z "$BLUESKY_HANDLE" ] || [ -z "$BLUESKY_PASSWORD" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "Bluesky secrets not configured"
            exit 1
          fi
          CODE=$(curl -s -o /tmp/bsky.json -w '%{http_code}' --max-time 20 \
            -X POST 'https://bsky.social/xrpc/com.atproto.server.createSession' \
            -H 'Content-Type: application/json' \
            --data "$(jq -n --arg i "$BLUESKY_HANDLE" --arg p "$BLUESKY_PASSWORD" \
                      '{identifier:$i,password:$p}')")
          if [ "$CODE" = "200" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=invalid" >> "$GITHUB_OUTPUT"
            echo "Bluesky auth returned HTTP $CODE"
            exit 1
          fi

      # ── Claude Code OAuth ─────────────────────────────────────────────────
      # A single trivial turn. This is the check that would have caught the
      # 2026-07-20 revocation on day one.
      - name: Check Claude Code OAuth
        id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 1 turn is not enough: the action treats hitting the cap as an
          # error, so a healthy token still reported failure. Same trap that
          # broke the scout at 5 turns.
          claude_args: "--max-turns 3 --dangerously-skip-permissions"
          prompt: 'Reply with exactly: ok'

      # ── PostHog ───────────────────────────────────────────────────────────
      # Added after finding analytics had never worked: the key rendered into
      # every page was 49 chars instead of 47, with a trailing "." that made
      # PostHog return 400 on every load. Nothing failed loudly — the build was
      # green, the script tag rendered, and the request 400'd in the browser
      # where no workflow was looking.
      - name: Check PostHog
        id: posthog
        continue-on-error: true
        env:
          POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}
        run: |
          if [ -z "$POSTHOG_KEY" ]; then
            echo "PUBLIC_POSTHOG_KEY not set"; exit 1
          fi
          # Shape check first: catches stray whitespace or punctuation from a
          # copy-paste, which is the failure that actually happened (a trailing
          # "." made the key 49 chars and PostHog returned 400).
          #
          # Deliberately NOT a length check. The first version of this asserted
          # 47 characters, which was a guess — real keys are 48 — so it would
          # have rejected the correct key and reported a false failure. The
          # character class is what actually distinguishes a clean key from a
          # copy-paste with punctuation attached, and it does not go stale if
          # PostHog changes key lengths.
          case "$POSTHOG_KEY" in
            phc_*) ;;
            *) echo "::error::key does not start with phc_"; exit 1 ;;
          esac
          case "$POSTHOG_KEY" in
            *[!A-Za-z0-9_]*)
              echo "::error::key contains a character outside [A-Za-z0-9_] — likely trailing punctuation or whitespace from a paste"
              exit 1 ;;
          esac
          CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
            "https://us-assets.i.posthog.com/array/${POSTHOG_KEY}/config.js")
          echo "PostHog config.js -> $CODE"
          [ "$CODE" = "200" ]

      # ── Cesium Ion ────────────────────────────────────────────────────────
      # The globe requests Ion assets 1 and 2 (imagery + terrain). A rejected
      # token 401s in the browser and the globe silently falls back, so this is
      # invisible from the server side.
      - name: Check Cesium Ion
        id: cesium
        continue-on-error: true
        env:
          ION_TOKEN: ${{ secrets.PUBLIC_CESIUM_ION_TOKEN }}
        run: |
          if [ -z "$ION_TOKEN" ]; then
            echo "PUBLIC_CESIUM_ION_TOKEN not set"; exit 1
          fi
          FAILED=0
          for ASSET in 1 2; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://api.cesium.com/v1/assets/${ASSET}/endpoint?access_token=${ION_TOKEN}")
            echo "Ion asset ${ASSET} -> $CODE"
            [ "$CODE" = "200" ] || FAILED=1
          done
          [ "$FAILED" -eq 0 ]

      # ── Report ───────────────────────────────────────────────────────────
      - name: Report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Infra alerts go to TELEGRAM_ALERT_CHAT_ID (private ops chat), NEVER to
          # TELEGRAM_CHANNEL_ID — that is the public content channel with
          # outside subscribers. If the alert secret is unset the guard below
          # exits quietly rather than falling back to the public channel.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_RESULT: ${{ steps.telegram.outcome }}
          BLUESKY_RESULT: ${{ steps.bluesky.outcome }}
          CLAUDE_RESULT: ${{ steps.claude.outcome }}
          POSTHOG_RESULT: ${{ steps.posthog.outcome }}
          CESIUM_RESULT: ${{ steps.cesium.outcome }}
        run: |
          FAILED=""
          [ "$TELEGRAM_RESULT" != "success" ] && FAILED="${FAILED}Telegram "
          [ "$BLUESKY_RESULT"  != "success" ] && FAILED="${FAILED}Bluesky "
          [ "$CLAUDE_RESULT"   != "success" ] && FAILED="${FAILED}Claude-OAuth "
          [ "$POSTHOG_RESULT"  != "success" ] && FAILED="${FAILED}PostHog "
          [ "$CESIUM_RESULT"   != "success" ] && FAILED="${FAILED}Cesium-Ion "

          {
            echo "## Credential Canary"
            echo ""
            echo "| Credential | Result |"
            echo "|------------|--------|"
            echo "| Telegram | $TELEGRAM_RESULT |"
            echo "| Bluesky | $BLUESKY_RESULT |"
            echo "| Claude Code OAuth | $CLAUDE_RESULT |"
            echo "| PostHog | $POSTHOG_RESULT |"
            echo "| Cesium Ion | $CESIUM_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -z "$FAILED" ]; then
            echo "All credentials healthy"
            exit 0
          fi

          echo "::error::Credential check failed for: $FAILED"

          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TEXT="🔑 Watchboard credential canary FAILED%0A%0ABroken: ${FAILED}%0A${RUN_URL}"

          # Telegram itself may be the thing that is broken, so this is
          # best-effort and never masks the job failure below.
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s --max-time 15 -X POST \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=${TEXT}" > /dev/null || true
          fi

          # A GitHub issue is the durable channel — it survives even when every
          # messaging credential is dead. Reuse an open one instead of piling up.
          TITLE="[canary] Credential check failing"
          EXISTING=$(gh issue list --search "$TITLE in:title" --state open \
                       --json number --jq '.[0].number // empty' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing: ${FAILED}(${RUN_URL})" || true
          else
            {
              echo "The daily credential canary is failing for: ${FAILED}"
              echo ""
              echo "Run: ${RUN_URL}"
              echo ""
              echo "| Credential | Result |"
              echo "|------------|--------|"
              echo "| Telegram | ${TELEGRAM_RESULT} |"
              echo "| Bluesky | ${BLUESKY_RESULT} |"
              echo "| Claude Code OAuth | ${CLAUDE_RESULT} |"
              echo ""
              echo "Rotate the affected secret, then re-run this workflow to confirm."
            } > /tmp/canary-issue.md
            gh issue create --title "$TITLE" --label "automation" \
              --body-file /tmp/canary-issue.md || true
          fi

          exit 1
