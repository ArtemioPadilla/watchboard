# nginx for the Watchboard self-host image (see Dockerfile).
# Location blocks with the site's headers are generated into
# /etc/nginx/conf.d/headers.conf by scripts/headers-to-nginx.ts.

worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  # Tracker JSON is large (a full tracker payload is hundreds of KB);
  # compressing it is the difference between a usable and a slow first load.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/xml application/json application/javascript
             application/xml application/rss+xml image/svg+xml application/wasm
             application/geo+json font/woff2;

  # Cesium ships .wasm, .glb and .czml; make sure they are typed.
  types {
    application/wasm wasm;
    model/gltf-binary glb;
    application/json czml;
    application/geo+json geojson;
  }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Liveness for HEALTHCHECK and orchestrators.
    location = /healthz {
      access_log off;
      # default_type sets the response's real Content-Type; add_header would
      # append a second one next to the http-block default.
      default_type text/plain;
      return 200 "ok\n";
    }

    error_page 404 /404.html;

    include /etc/nginx/conf.d/headers.conf;
  }
}
